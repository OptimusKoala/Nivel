name: Nivel
options:
  bundleIdPrefix: com.elitedangereuse
  deploymentTarget:
    iOS: "17.0"
packages:
  NivelCore:
    path: NivelCore
targets:
  Nivel:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        DEVELOPMENT_TEAM: AXVF69V3LL
        # iPhone SEUL. En universel (défaut), l'archive avertit qu'une app portrait
        # strict doit supporter toutes les orientations, et l'App Store réclamerait
        # en plus des captures iPad 13 pouces.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Debug est EXPLICITEMENT en signature automatique. Sans ces trois lignes, Xcode
        # « répare » le projet dès qu'on ouvre Signing & Capabilities et propage le profil
        # App Store de Release dans Debug. L'installation échoue alors sur l'appareil avec
        # « Attempted to install a Beta profile without the proper entitlement » (0xe800801f),
        # message qui ne dit rien de sa vraie cause. Le projet étant généré, la réparation
        # d'Xcode n'est jamais committée : elle disparaît au prochain xcodegen, ce qui rend
        # le défaut intermittent et d'autant plus pénible à diagnostiquer.
        Debug:
          NIVEL_APS_ENVIRONMENT: development
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: ""
        # Signature MANUELLE en Release, appareil uniquement (scripts/release.sh) : la
        # signature automatique choisit un profil de DÉVELOPPEMENT à l'archivage, et la
        # team n'a aucun appareil enregistré — donc aucun profil de dev possible. Archiver
        # sans signature marche, mais l'export perd alors les entitlements HealthKit et
        # App Group (ils viennent du binaire signé, pas du profil).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Nivel App Store
          NIVEL_APS_ENVIRONMENT: production
    dependencies:
      - package: NivelCore
      - target: NivelWidgets
    entitlements:
      path: App/Nivel.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.com.elitedangereuse.nivel.data]
        # Duo de la 1.15 (spec §3.2) : la zone partagée vit dans ce conteneur, et rien
        # d'autre n'y va. Sans duo appairé, aucune requête n'est émise.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.elitedangereuse.Nivel]
        com.apple.developer.icloud-services: [CloudKit]
        # Réveil silencieux pour aller chercher les cœurs (spec §3.7).
        #
        # La valeur dépend de la CONFIGURATION : `development` en Debug, `production` en
        # Release (voir `NIVEL_APS_ENVIRONMENT` sous configs). Un profil App Store ne
        # porte que `production`, et la signature étant MANUELLE, rien ne réécrit cette
        # clé à l'archivage comme le ferait la signature automatique — un `development`
        # livré donnerait une app où les cœurs n'arrivent jamais, sans le moindre message.
        #
        # UNE variable plutôt que DEUX fichiers d'entitlements, et ce n'est pas un
        # raccourci : XcodeGen ne génère qu'un fichier par cible et écrit
        # `CODE_SIGN_ENTITLEMENTS` dans CHAQUE configuration, ce qui écrase toute
        # surcharge (mesuré). Deux fichiers devraient donc être écrits à la main tous les
        # deux, et les quatre clés communes y divergeraient un jour en silence. Ici elles
        # n'existent qu'une fois : la divergence est impossible, pas seulement improbable.
        #
        # La substitution elle-même est vérifiée à l'export par `scripts/release.sh`, qui
        # lit les entitlements du binaire SIGNÉ et refuse l'envoi si cette clé ne vaut pas
        # `production`. C'est cette vérification qui rend la variable sûre : sans elle on
        # ferait un pari silencieux.
        aps-environment: $(NIVEL_APS_ENVIRONMENT)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nivel
        CFBundleDevelopmentRegion: fr
        # Catégorie App Store. Dans un Info.plist fourni à la main, les réglages
        # INFOPLIST_KEY_* ne sont PAS repris : la clé doit être écrite ici.
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        # Version affichée dans Réglages > À propos — à incrémenter à chaque jalon.
        CFBundleShortVersionString: "1.15.2"
        CFBundleVersion: "20"
        NSHealthShareUsageDescription: "Nivel lit tes pas pour suivre ton activité quotidienne."
        # Exigée par la validation Apple (erreur 90683) dès que HealthKit est lié, même
        # sans le moindre accès en écriture — et Nivel n'en demande aucun. Cette phrase
        # ne sera donc jamais affichée : autant qu'elle dise la vérité.
        NSHealthUpdateUsageDescription: "Nivel n'écrit rien dans Santé : il se contente de lire tes pas."
        # Aucun chiffrement au-delà d'HTTPS système : évite le questionnaire export à chaque build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Scanner de QR code de l'appairage (spec 1.15 §3.6). Un champ « coller un
        # lien » sert de repli quand la caméra est refusée : la permission n'est jamais
        # un passage obligé.
        NSCameraUsageDescription: "Nivel utilise l'appareil photo pour scanner le QR code de ton duo."
        # Alerte CloudKit à l'arrivée d'un cœur et rafraîchissement associé.
        UIBackgroundModes: [remote-notification]
        # Deep link des widgets : nivel://log-meal (spec widgets §7).
        CFBundleURLTypes:
          - CFBundleURLName: com.elitedangereuse.Nivel
            CFBundleURLSchemes: [nivel]
  NivelWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        DEVELOPMENT_TEAM: AXVF69V3LL
        # Une extension DOIT être préfixée par le bundle id de l'app.
        PRODUCT_BUNDLE_IDENTIFIER: com.elitedangereuse.Nivel.Widgets
      configs:
        # Debug explicitement automatique, pour la même raison que la cible Nivel : une
        # extension signée avec le profil App Store fait échouer l'installation de l'app
        # entière sur l'appareil, et le message d'erreur ne nomme que l'app.
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: ""
        # Même signature manuelle que l'app, avec le profil de l'extension.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Nivel Widgets App Store
    dependencies:
      - package: NivelCore
    entitlements:
      path: Widgets/NivelWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.elitedangereuse.nivel.data]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nivel
        CFBundleDevelopmentRegion: fr
        # Alignées sur l'app (sinon XcodeGen retombe sur 1.0/1).
        CFBundleShortVersionString: "1.15.2"
        CFBundleVersion: "20"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  NivelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NivelTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Nivel
  # Sert UNIQUEMENT à filmer l'aperçu App Store (scripts/preview.sh) : il faut piloter
  # l'app pendant que simctl enregistre l'écran, ce qu'aucun test unitaire ne peut faire.
  # Volontairement hors du schéma Nivel, pour ne pas ralentir les tests de tous les jours.
  NivelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NivelUITests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Nivel
    dependencies:
      - target: Nivel
schemes:
  Nivel:
    build: { targets: { Nivel: all, NivelTests: [test] } }
    test: { targets: [NivelTests] }
  NivelPreview:
    build: { targets: { Nivel: all, NivelUITests: [test] } }
    test: { targets: [NivelUITests] }
