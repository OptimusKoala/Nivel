name: Nivel
options:
  bundleIdPrefix: fr.mbernard
  deploymentTarget:
    iOS: "17.0"
packages:
  NivelCore:
    path: NivelCore
targets:
  Nivel:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        DEVELOPMENT_TEAM: 5V52773QN3
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    dependencies:
      - package: NivelCore
      - target: NivelWidgets
    entitlements:
      path: App/Nivel.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.fr.mbernard.nivel]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nivel
        CFBundleDevelopmentRegion: fr
        # Version affichée dans Réglages > À propos — à incrémenter à chaque jalon.
        CFBundleShortVersionString: "1.7"
        CFBundleVersion: "8"
        NSHealthShareUsageDescription: "Nivel lit tes pas pour suivre ton activité quotidienne."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Deep link des widgets : nivel://log-meal (spec widgets §7).
        CFBundleURLTypes:
          - CFBundleURLName: fr.mbernard.Nivel
            CFBundleURLSchemes: [nivel]
  NivelWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        DEVELOPMENT_TEAM: 5V52773QN3
        # Une extension DOIT être préfixée par le bundle id de l'app.
        PRODUCT_BUNDLE_IDENTIFIER: fr.mbernard.Nivel.Widgets
    dependencies:
      - package: NivelCore
    entitlements:
      path: Widgets/NivelWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.mbernard.nivel]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nivel
        CFBundleDevelopmentRegion: fr
        # Alignées sur l'app (sinon XcodeGen retombe sur 1.0/1).
        CFBundleShortVersionString: "1.7"
        CFBundleVersion: "8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  NivelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NivelTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Nivel
schemes:
  Nivel:
    build: { targets: { Nivel: all, NivelTests: [test] } }
    test: { targets: [NivelTests] }
