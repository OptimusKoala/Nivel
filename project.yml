name: Nivel
options:
  bundleIdPrefix: fr.mbernard
  deploymentTarget:
    iOS: "17.0"
packages:
  NivelCore:
    path: NivelCore
targets:
  Nivel:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        DEVELOPMENT_TEAM: 5V52773QN3
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    dependencies:
      - package: NivelCore
    entitlements:
      path: App/Nivel.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nivel
        CFBundleDevelopmentRegion: fr
        # Version affichée dans Réglages > À propos — à incrémenter à chaque jalon.
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "4"
        NSHealthShareUsageDescription: "Nivel lit tes pas pour suivre ton activité quotidienne."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  NivelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NivelTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Nivel
schemes:
  Nivel:
    build: { targets: { Nivel: all, NivelTests: [test] } }
    test: { targets: [NivelTests] }
