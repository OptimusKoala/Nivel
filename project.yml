name: Nivel
options:
  bundleIdPrefix: com.elitedangereuse
  deploymentTarget:
    iOS: "17.0"
packages:
  NivelCore:
    path: NivelCore
targets:
  Nivel:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        DEVELOPMENT_TEAM: AXVF69V3LL
        # iPhone SEUL. En universel (défaut), l'archive avertit qu'une app portrait
        # strict doit supporter toutes les orientations, et l'App Store réclamerait
        # en plus des captures iPad 13 pouces.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Signature MANUELLE en Release, appareil uniquement (scripts/release.sh) : la
        # signature automatique choisit un profil de DÉVELOPPEMENT à l'archivage, et la
        # team n'a aucun appareil enregistré — donc aucun profil de dev possible. Archiver
        # sans signature marche, mais l'export perd alors les entitlements HealthKit et
        # App Group (ils viennent du binaire signé, pas du profil).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Nivel App Store
    dependencies:
      - package: NivelCore
      - target: NivelWidgets
    entitlements:
      path: App/Nivel.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.com.elitedangereuse.nivel.data]
        # Duo de la 1.15 (spec §3.2) : la zone partagée vit dans ce conteneur, et rien
        # d'autre n'y va. Sans duo appairé, aucune requête n'est émise.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.elitedangereuse.Nivel]
        com.apple.developer.icloud-services: [CloudKit]
        # Réveil silencieux pour aller chercher les cœurs (spec §3.7).
        #
        # ATTENTION, valeur de DÉVELOPPEMENT. Un profil App Store porte
        # `aps-environment: production`, et la signature étant MANUELLE en Release
        # (voir configs ci-dessus), rien ne réécrit cette clé à l'archivage comme le
        # ferait la signature automatique. À vérifier avant la première release qui
        # embarque le duo.
        aps-environment: development
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nivel
        CFBundleDevelopmentRegion: fr
        # Catégorie App Store. Dans un Info.plist fourni à la main, les réglages
        # INFOPLIST_KEY_* ne sont PAS repris : la clé doit être écrite ici.
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        # Version affichée dans Réglages > À propos — à incrémenter à chaque jalon.
        CFBundleShortVersionString: "1.14"
        CFBundleVersion: "17"
        NSHealthShareUsageDescription: "Nivel lit tes pas pour suivre ton activité quotidienne."
        # Exigée par la validation Apple (erreur 90683) dès que HealthKit est lié, même
        # sans le moindre accès en écriture — et Nivel n'en demande aucun. Cette phrase
        # ne sera donc jamais affichée : autant qu'elle dise la vérité.
        NSHealthUpdateUsageDescription: "Nivel n'écrit rien dans Santé : il se contente de lire tes pas."
        # Aucun chiffrement au-delà d'HTTPS système : évite le questionnaire export à chaque build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Scanner de QR code de l'appairage (spec 1.15 §3.6). Un champ « coller un
        # lien » sert de repli quand la caméra est refusée : la permission n'est jamais
        # un passage obligé.
        NSCameraUsageDescription: "Nivel utilise l'appareil photo pour scanner le QR code de ton duo."
        # Réveil silencieux à l'arrivée d'un cœur (spec §3.7). L'app poste ensuite
        # elle-même la notification locale, ce qui lui donne le texte exact.
        UIBackgroundModes: [remote-notification]
        # Deep link des widgets : nivel://log-meal (spec widgets §7).
        CFBundleURLTypes:
          - CFBundleURLName: com.elitedangereuse.Nivel
            CFBundleURLSchemes: [nivel]
  NivelWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        DEVELOPMENT_TEAM: AXVF69V3LL
        # Une extension DOIT être préfixée par le bundle id de l'app.
        PRODUCT_BUNDLE_IDENTIFIER: com.elitedangereuse.Nivel.Widgets
      configs:
        # Même signature manuelle que l'app, avec le profil de l'extension.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: Nivel Widgets App Store
    dependencies:
      - package: NivelCore
    entitlements:
      path: Widgets/NivelWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.elitedangereuse.nivel.data]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nivel
        CFBundleDevelopmentRegion: fr
        # Alignées sur l'app (sinon XcodeGen retombe sur 1.0/1).
        CFBundleShortVersionString: "1.14"
        CFBundleVersion: "17"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  NivelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NivelTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Nivel
  # Sert UNIQUEMENT à filmer l'aperçu App Store (scripts/preview.sh) : il faut piloter
  # l'app pendant que simctl enregistre l'écran, ce qu'aucun test unitaire ne peut faire.
  # Volontairement hors du schéma Nivel, pour ne pas ralentir les tests de tous les jours.
  NivelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NivelUITests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Nivel
    dependencies:
      - target: Nivel
schemes:
  Nivel:
    build: { targets: { Nivel: all, NivelTests: [test] } }
    test: { targets: [NivelTests] }
  NivelPreview:
    build: { targets: { Nivel: all, NivelUITests: [test] } }
    test: { targets: [NivelUITests] }
